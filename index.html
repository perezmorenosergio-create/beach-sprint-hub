<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Beach Sprint Timer</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css?v=20">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script type="module" src="app.js?v=20"></script>
</head>
<body>
  <section id="authScreen" class="auth-screen">
    <div class="auth-card">
      <div class="auth-logo">⏱</div>
      <h1>Beach Sprint Timer</h1>
      <p>Tu cronómetro y tus datos, privados y sincronizados.</p>

      <div class="auth-tabs">
        <button id="loginTab" class="auth-tab active" type="button">Iniciar sesión</button>
        <button id="signupTab" class="auth-tab" type="button">Crear cuenta</button>
      </div>

      <form id="authForm">
        <label id="fullNameLabel" class="hidden">
          <span>Nombre</span>
          <input id="fullNameInput" autocomplete="name" placeholder="Sergio Pérez">
        </label>
        <label>
          <span>Correo electrónico</span>
          <input id="emailInput" type="email" required autocomplete="email" placeholder="correo@ejemplo.com">
        </label>
        <label>
          <span>Contraseña</span>
          <input id="passwordInput" type="password" required minlength="6" autocomplete="current-password" placeholder="Mínimo 6 caracteres">
        </label>
        <button id="authSubmitButton" class="primary-button full-width" type="submit">Iniciar sesión</button>
      </form>

      <button id="forgotPasswordButton" class="link-button" type="button">He olvidado mi contraseña</button>
      <p id="authMessage" class="auth-message"></p>
    </div>
  </section>

  <div id="appShell" class="hidden">
    <header class="app-header">
      <div>
        <h1>Beach Sprint Timer</h1>
        <p>Cronometraje y control de sesiones</p>
      </div>
      <div class="header-actions">
        <span id="userEmail" class="user-email"></span>
        <button id="languageButton" class="ghost-button" type="button">EN</button>
        <button id="logoutButton" class="ghost-button" type="button">Salir</button>
      </div>
    </header>

    <nav class="tabs">
      <button class="tab active" data-view="sessionView" type="button">Sesión</button>
      <button class="tab" data-view="athletesView" type="button">Deportistas</button>
      <button class="tab" data-view="historyView" type="button">Historial</button>
    </nav>

    <main>
      <div id="syncBanner" class="sync-banner">☁️ Sincronizado</div>

      <section id="sessionView" class="view active">
        <div class="panel">
          <h2>Preparar sesión</h2>
          <div class="form-grid">
            <label><span>Nombre de la sesión</span><input id="sessionName" value="3x(3xTT-2') - 15' rest"></label>
            <label><span>Formato</span><select id="sessionFormat"><option value="tt">Time Trial</option><option value="knockout">Knockout</option><option value="custom">Personalizado</option></select></label>
            <label><span>Laps por deportista</span><input id="lapCount" type="number" min="1" max="30" value="3"></label>
            <label><span>Salida</span><select id="startMode"><option value="joint">Conjunta</option><option value="individual">Individual</option></select></label>
          </div>
        </div>

        <div class="panel">
          <div class="panel-heading">
            <div><h2>Seleccionar deportistas</h2><p id="selectionSummary" class="muted"></p></div>
            <button id="toggleAllAthletes" class="outline-button" type="button">Seleccionar todos</button>
          </div>
          <div id="sessionAthleteCards" class="athlete-selection-grid"></div>
        </div>
        <button id="prepareTimerButton" class="primary-button full-width" type="button">Preparar cronómetro</button>
      </section>

      <section id="athletesView" class="view">
        <div class="panel">
          <div class="panel-heading">
            <div><h2>Mis deportistas</h2><p class="muted">Privados y sincronizados con tu cuenta.</p></div>
            <button id="downloadTemplateButton" class="outline-button" type="button">Plantilla CSV</button>
          </div>
          <form id="athleteForm" class="athlete-form">
            <input id="athleteName" required placeholder="Nombre y apellidos">
            <input id="athleteClub" placeholder="Club / país">
            <input id="athleteCategory" placeholder="Categoría">
            <input id="athleteBib" placeholder="Dorsal">
            <button class="primary-button" type="submit">Añadir</button>
          </form>
          <div class="import-row">
            <label class="primary-button file-button"><span>Importar Excel/CSV</span><input id="athleteFileInput" type="file" accept=".xlsx,.xls,.csv"></label>
            <span id="importMessage" class="status-message"></span>
          </div>
        </div>
        <div class="panel"><div id="athleteManagementList" class="management-list"></div></div>
      </section>

      <section id="timerView" class="view">
        <div class="timer-top">
          <div><h2 id="liveSessionName"></h2><p id="liveSessionInfo" class="muted"></p></div>
          <div id="globalTimer" class="global-timer">00:00.000</div>
        </div>
        <div class="timer-actions">
          <button id="startAllButton" class="primary-button" type="button">Iniciar todos</button>
          <button id="undoButton" class="warning-button" type="button">Deshacer</button>
          <button id="finishSessionButton" class="danger-button" type="button">Finalizar</button>
        </div>
        <div id="timerAthleteGrid" class="timer-grid"></div>
      </section>

      <section id="resultsView" class="view">
        <div class="panel">
          <div class="panel-heading"><h2>Resultados</h2><button id="exportResultsButton" class="primary-button" type="button">Exportar CSV</button></div>
          <div id="resultsContainer" class="table-scroll"></div>
        </div>
        <button id="newSessionButton" class="outline-button full-width" type="button">Nueva sesión</button>
      </section>

      <section id="historyView" class="view">
        <div class="panel"><h2>Historial de sesiones</h2><div id="historyList" class="management-list"></div></div>
      </section>
    </main>
  </div>
</body>
</html>
